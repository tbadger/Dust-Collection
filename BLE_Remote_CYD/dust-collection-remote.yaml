esphome:
  name: dust-collection-remote
  friendly_name: Dust Collection Remote
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32   # Confirmed: board silkscreen reads ESP32-32E (plain
                     # ESP32-WROOM-32E, not S3) — BLE 4.2, not 5.0. Fine for
                     # this simple notify-only use case.
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API (kept — useful for OTA/monitoring even though
# the remote's main job is BLE, not WiFi. Confirmed WiFi+BLE coexistence
# was NOT the connect() blocker — see CLAUDE.md item 4 for the debugging
# trail; root cause was an unresolved ArduinoBLE central-mode bug on the
# Giga, fixed by swapping roles so the CYD is the BLE central instead.)
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# SPI Bus
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# ST7796 Display
display:
  - platform: mipi_spi
    model: ST7796
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    rotation: 0
    id: my_display

# Touchscreen
touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3800
      y_min: 200
      y_max: 3800
    transform:
      mirror_y: true
    on_touch:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - script.execute: dim_backlight

# Outputs
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_output

# Lights
light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# Scripts
script:
  # Idle dim — unconditional now (no print/bed-temp gating like the old
  # mini-dash had; this board no longer tracks those entities).
  - id: dim_backlight
    mode: restart
    then:
      - delay: 2min
      - light.turn_on:
          id: backlight
          brightness: 50%

  # One parameterized script for all 4 gate buttons — CYD is the BLE
  # CENTRAL here (role swap — see CLAUDE.md item 4). Writes the gate index
  # straight to the Giga's characteristic instead of notifying subscribers.
  - id: send_gate_command
    parameters:
      gate_index: int
    then:
      - ble_client.ble_write:
          id: giga_ble
          service_uuid: "5f2d958b-1564-4547-9566-64862169a9e4"
          characteristic_uuid: "3c711568-4467-44b3-9f0f-a7efb402c8ba"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) gate_index};'
      - lvgl.label.update:
          id: status_label
          text: !lambda |-
            static const char* names[] = {"CNC Router", "Table Saw", "Sander", "Drill Press"};
            std::string s = "Sent: ";
            s += names[gate_index];
            return s;

# BLE central — CYD connects out to the Giga's peripheral advertisement
# (local name "DustCollection") and writes the gate index directly.
# MAC address is the Giga's fixed BLE address (captured from its own
# Serial log at BLE.begin() — confirm it hasn't changed if this stops
# connecting). UUIDs must match DustCollection_Giga.ino exactly.
esp32_ble_tracker:

ble_client:
  - mac_address: "A8:61:0A:40:62:08"
    id: giga_ble
    auto_connect: true

# LVGL UI
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  bg_color: 0x000000
  default_font: montserrat_24
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - label:
            id: title_label
            text: "Dust Collection"
            align: TOP_MID
            y: 6
            text_font: montserrat_28
            text_color: 0xFFFFFF
        - label:
            id: status_label
            text: "Tap a tool to route dust collection"
            align: TOP_MID
            y: 40
            text_font: montserrat_16
            text_color: 0x9E9E9E

        # Tool 1 — CNC Router
        - button:
            id: gate_btn_0
            x: 8
            y: 66
            width: 304
            height: 96
            radius: 10
            bg_color: 0xF85149
            on_click:
              - script.execute:
                  id: send_gate_command
                  gate_index: 0
            widgets:
              - label:
                  text: "CNC Router"
                  align: CENTER
                  text_font: montserrat_32
                  text_color: 0xFFFFFF

        # Tool 2 — Table Saw
        - button:
            id: gate_btn_1
            x: 8
            y: 172
            width: 304
            height: 96
            radius: 10
            bg_color: 0x58A6FF
            on_click:
              - script.execute:
                  id: send_gate_command
                  gate_index: 1
            widgets:
              - label:
                  text: "Table Saw"
                  align: CENTER
                  text_font: montserrat_32
                  text_color: 0xFFFFFF

        # Tool 3 — Sander
        - button:
            id: gate_btn_2
            x: 8
            y: 278
            width: 304
            height: 96
            radius: 10
            bg_color: 0x3FB950
            on_click:
              - script.execute:
                  id: send_gate_command
                  gate_index: 2
            widgets:
              - label:
                  text: "Sander"
                  align: CENTER
                  text_font: montserrat_32
                  text_color: 0xFFFFFF

        # Tool 4 — Drill Press (DC only, no gate pin on Giga side)
        - button:
            id: gate_btn_3
            x: 8
            y: 384
            width: 304
            height: 96
            radius: 10
            bg_color: 0xD29922
            on_click:
              - script.execute:
                  id: send_gate_command
                  gate_index: 3
            widgets:
              - label:
                  text: "Drill Press"
                  align: CENTER
                  text_font: montserrat_32
                  text_color: 0xFFFFFF

        - label:
            id: wifi_icon
            text: ""
            align: TOP_RIGHT
            x: -6
            y: 6
            text_font: montserrat_20
            text_color: 0xC62828

# Binary sensors
binary_sensor:
  # API/HA connection state - drives wifi icon color (useful for confirming
  # the board's online for OTA/logs)
  - platform: status
    id: api_connected
    on_press:
      - lvgl.label.update:
          id: wifi_icon
          text: ""
          text_color: 0xFFFFFF
    on_release:
      - lvgl.label.update:
          id: wifi_icon
          text: ""
          text_color: 0xC62828
